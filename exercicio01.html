<script>
let a = n1;
let b = n2;
let c = n3;

let delta = b*b-4*a*c;

if (delta < 0) {
    delta = "Delta negativo"};

let x1 = (-b+Math.sqrt(delta))/(2*a);
let x2 = (-b-Math.sqrt(delta))/(2*a);
</script>
